<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Student</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(to right,#4facfe,#00f2fe);
    }

    .container{
        width:350px;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    .input-box{
        margin-bottom:15px;
    }

    .input-box input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:5px;
        outline:none;
        font-size:15px;
    }

    .input-box input:focus{
        border-color:#4facfe;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:5px;
        background:#4facfe;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#00c6fb;
    }

</style>

</head>
<body>

    <div class="container">

        <h2>Add Student</h2>

        <form action="/add" method="post">

            <div class="input-box">
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>

            <div class="input-box">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit">Add Student</button>

        </form>

    </div>

</body>
</html>

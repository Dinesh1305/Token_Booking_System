<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification Result</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Animated Background Blobs */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Floating animation */
        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .floating-card {
            animation: floating 5s ease-in-out infinite;
        }

        /* Success Glow */
        @keyframes glowGreen {
            0% {
                box-shadow: 0 0 0 rgba(34,197,94,0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(34,197,94,0.5);
            }
            100% {
                box-shadow: 0 0 0 rgba(34,197,94,0.3);
            }
        }

        /* Error Glow */
        @keyframes glowRed {
            0% {
                box-shadow: 0 0 0 rgba(239,68,68,0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(239,68,68,0.5);
            }
            100% {
                box-shadow: 0 0 0 rgba(239,68,68,0.3);
            }
        }

        .success-glow {
            animation: glowGreen 2s infinite;
        }

        .error-glow {
            animation: glowRed 2s infinite;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-cyan-50 via-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <!-- Background Blobs -->
    <div class="absolute top-10 left-10 w-80 h-80 bg-cyan-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob"></div>

    <div class="absolute top-32 right-10 w-80 h-80 bg-blue-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <div class="absolute bottom-0 left-1/3 w-80 h-80 bg-indigo-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

    <!-- Result Card -->
    <div class="relative z-10 floating-card bg-white/40 backdrop-blur-2xl border border-white/60 p-8 sm:p-10 rounded-[2.2rem] shadow-[0_12px_40px_rgba(31,38,135,0.10)] w-full max-w-md text-center transition duration-300 hover:shadow-[0_16px_50px_rgba(31,38,135,0.15)]">

        <!-- SUCCESS SECTION -->
        <div th:if="${isVerified}">

            <!-- Success Icon -->
            <div class="w-24 h-24 bg-green-100 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-lg success-glow">

                <svg class="w-12 h-12 text-green-500"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M5 13l4 4L19 7">
                    </path>

                </svg>

            </div>

            <!-- Heading -->
            <h2 class="text-3xl font-bold text-gray-800 mb-3">
                Verification Successful 🎉
            </h2>

            <!-- Message -->
            <p class="text-green-600 font-medium text-base leading-relaxed mb-7">
                Your OTP has been verified successfully.
                <br>
                Your token booking is now confirmed.
            </p>

            <!-- Status Box -->
            <div class="bg-green-50/70 border border-green-100 rounded-2xl p-4 mb-7 shadow-sm">

                <div class="flex items-center justify-center gap-3">

                    <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>

                    <span class="text-green-700 font-semibold">
                        Booking Confirmed
                    </span>

                </div>

            </div>

        </div>

        <!-- FAILURE SECTION -->
        <div th:unless="${isVerified}">

            <!-- Error Icon -->
            <div class="w-24 h-24 bg-red-100 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-lg error-glow">

                <svg class="w-12 h-12 text-red-500"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M6 18L18 6M6 6l12 12">
                    </path>

                </svg>

            </div>

            <!-- Heading -->
            <h2 class="text-3xl font-bold text-gray-800 mb-3">
                Verification Failed
            </h2>

            <!-- Message -->
            <p class="text-red-600 font-medium text-base leading-relaxed mb-7">
                The OTP you entered is invalid or expired.
                <br>
                Please try again carefully.
            </p>

            <!-- Status Box -->
            <div class="bg-red-50/70 border border-red-100 rounded-2xl p-4 mb-7 shadow-sm">

                <div class="flex items-center justify-center gap-3">

                    <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>

                    <span class="text-red-700 font-semibold">
                        Verification Failed
                    </span>

                </div>

            </div>

        </div>

        <!-- Dashboard Button -->
        <a href="/admin/dashboard"
           class="inline-flex items-center justify-center gap-2 w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600 hover:from-cyan-400 hover:via-blue-400 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition-all duration-300 hover:-translate-y-1 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-300/40">

            ← Back to Dashboard

        </a>

        <!-- Footer -->
        <div class="mt-6 text-xs text-gray-500">
            Secure OTP verification system 🔒
        </div>

    </div>

</body>
</html>

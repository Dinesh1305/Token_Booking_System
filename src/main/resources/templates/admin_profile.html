<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - Today's Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.52);
            --glass-border: rgba(255,255,255,0.72);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f7f7 0%, #b2dfdb 35%, #e0f2f1 70%, #f0fdfa 100%);
            min-height: 100vh;
            color: #0a4a4a;
            overflow-x: hidden;
        }

        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }
        .blob1 { width: 420px; height: 420px; background: radial-gradient(circle, #26c6da, #00897b); top: -80px; left: -100px; animation-duration: 12s; }
        .blob2 { width: 340px; height: 340px; background: radial-gradient(circle, #80deea, #4db6ac); bottom: 60px; right: -80px; animation-duration: 9s; animation-delay: 3s; }
        
        @keyframes floatBlob { from { transform: translateY(0) scale(1); } to { transform: translateY(30px) scale(1.07); } }

        .glass-card {
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border-radius: 1.75rem;
            box-shadow: 0 8px 32px 0 rgba(0,100,100,0.10), 0 1.5px 6px rgba(0,150,150,0.06);
            position: relative;
            z-index: 1;
        }

        .btn-back {
            background: linear-gradient(135deg, #0097a7 0%, #00796b 100%);
            color: #fff;
            border-radius: 0.875rem;
            font-weight: 600;
            transition: transform 0.18s, box-shadow 0.22s;
            box-shadow: 0 3px 14px rgba(0,140,140,0.22);
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,140,140,0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>

    <div class="max-w-6xl mx-auto space-y-6 relative z-10">

        <!-- Navigation -->
        <nav class="sticky top-4 z-50">
            <div class="glass-card flex justify-between items-center px-6 py-4">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-800 flex items-center justify-center shadow-md">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-teal-950 leading-tight">Admin Profile</h1>
                        <p class="text-xs font-semibold text-teal-600 uppercase tracking-widest">Today's Overview</p>
                    </div>
                </div>
                <a href="/admin_dashboard" class="btn-back px-5 py-2.5 text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    Admin Panel
                </a>
            </div>
        </nav>

        <!-- Stats Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 flex items-center gap-5">
                <div class="h-14 w-14 rounded-2xl bg-cyan-100 flex items-center justify-center">
                    <svg class="w-7 h-7 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <div>
                    <p class="text-sm text-teal-700 font-semibold uppercase tracking-wider">Tokens Booked Today</p>
                    <p class="text-4xl font-extrabold text-teal-950 mt-1" th:text="${totalTokens}">0</p>
                </div>
            </div>

            <div class="glass-card p-6 flex items-center gap-5">
                <div class="h-14 w-14 rounded-2xl bg-teal-100 flex items-center justify-center">
                    <svg class="w-7 h-7 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <p class="text-sm text-teal-700 font-semibold uppercase tracking-wider">Today's Revenue</p>
                    <p class="text-4xl font-extrabold text-teal-950 mt-1">₹<span th:text="${totalRevenue}">0</span></p>
                </div>
            </div>
        </div>

        <!-- Today's Bookings Table -->
        <div class="glass-card p-6 md:p-8">
            <h3 class="text-xl font-bold text-teal-950 mb-4">Today's Active Bookings</h3>
            
            <div class="overflow-x-auto rounded-2xl border border-white/60 shadow-inner bg-white/20">
                <table class="w-full text-left border-collapse" style="min-width:700px;">
                    <thead>
                        <tr style="background:rgba(178,223,219,0.40);">
                            <th class="px-6 py-4 text-teal-800 uppercase font-bold text-xs tracking-wider">Time</th>
                            <th class="px-6 py-4 text-teal-800 uppercase font-bold text-xs tracking-wider">Student Email</th>
                            <th class="px-6 py-4 text-teal-800 uppercase font-bold text-xs tracking-wider">Food Item</th>
                            <th class="px-6 py-4 text-teal-800 uppercase font-bold text-xs tracking-wider">Cost</th>
                            <th class="px-6 py-4 text-teal-800 uppercase font-bold text-xs tracking-wider">Delivery Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-teal-100/50">
                        <tr th:each="bill : ${bookings}" class="hover:bg-white/40 transition-colors">
                            <td class="px-6 py-4 text-sm font-semibold text-teal-800" th:text="${#dates.format(bill.bookingTime, 'hh:mm a')}">12:30 PM</td>
                            <td class="px-6 py-4 text-sm font-medium text-cyan-900" th:text="${bill.email}">student@college.edu</td>
                            <td class="px-6 py-4 text-sm font-bold text-teal-900" th:text="${bill.foodItem}">Chicken Gravy</td>
                            <td class="px-6 py-4 text-sm font-bold text-teal-600" th:text="'₹' + ${bill.cost}">₹100</td>
                            <td class="px-6 py-4">
                                <!-- Status Badge changes color based on Received / Not Received -->
                                <span th:if="${bill.status == 'Received'}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold border border-emerald-200">
                                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                                    Received
                                </span>
                                
                                <span th:if="${bill.status == 'Not Received'}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-100 text-orange-700 text-xs font-bold border border-orange-200">
                                    <span class="h-2 w-2 rounded-full bg-orange-400 animate-pulse"></span>
                                    Not Received
                                </span>
                            </td>
                        </tr>

                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="5" class="px-6 py-12 text-center text-teal-700 font-semibold bg-white/20">
                                No tokens have been booked yet today.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>

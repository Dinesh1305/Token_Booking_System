<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Scan Token</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-300 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">

        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
            <span class="text-3xl">👨‍🍳</span>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">
            Admin Dashboard
        </h2>

        <p class="text-gray-500 text-sm mb-6">
            Enter student email and 4-digit token OTP to verify the meal.
        </p>

        <form action="/verify" method="post" class="space-y-5">

            <!-- Email -->
            <div>
                <input type="email"
                       name="email"
                       required
                       placeholder="Student Email"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl 
                              focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>

            <!-- OTP -->
            <div>
                <input type="text"
                       name="otp"
                       required
                       maxlength="4"
                       pattern="\d{4}"
                       class="w-full text-center tracking-[0.5em] text-2xl px-4 py-3 
                              border border-gray-300 rounded-xl 
                              focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                       placeholder="••••">
            </div>

            <!-- Button -->
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white 
                           font-semibold py-3 px-4 rounded-xl shadow-md 
                           transition duration-200">
                Verify Token
            </button>

        </form>

        <div class="mt-6 border-t pt-4">
            <a href="/"
               class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                Log Out
            </a>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter OTP</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Animated blobs */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Floating card animation */
        @keyframes floatCard {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .floating-card {
            animation: floatCard 5s ease-in-out infinite;
        }

        /* Pulse glow */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 rgba(34,211,238,0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(34,211,238,0.5);
            }
            100% {
                box-shadow: 0 0 0 rgba(34,211,238,0.3);
            }
        }

        .otp-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-cyan-50 via-teal-50 to-blue-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Blobs -->
    <div class="absolute top-10 left-10 w-80 h-80 bg-cyan-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob"></div>

    <div class="absolute top-40 right-10 w-80 h-80 bg-teal-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <div class="absolute bottom-0 left-1/3 w-80 h-80 bg-blue-300 rounded-full mix-blend-multiply blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

    <!-- OTP Card -->
    <div class="relative floating-card bg-white/40 backdrop-blur-2xl border border-white/60 p-8 sm:p-10 rounded-[2.2rem] shadow-[0_12px_40px_rgba(31,38,135,0.10)] w-full max-w-md text-center z-10 transition duration-300 hover:shadow-[0_16px_50px_rgba(31,38,135,0.15)]">

        <!-- Top Icon -->
        <div class="relative mb-5">

            <div class="w-20 h-20 bg-gradient-to-r from-cyan-500 via-teal-500 to-cyan-600 rounded-3xl flex items-center justify-center mx-auto shadow-xl otp-glow">

                <span class="text-4xl">🔐</span>

            </div>

            <!-- Small verified badge -->
            <div class="absolute bottom-0 right-[35%] bg-white rounded-full shadow-md border border-white w-7 h-7 flex items-center justify-center text-sm">
                ✨
            </div>

        </div>

        <!-- Heading -->
        <h2 class="text-3xl font-bold text-cyan-950 mb-2 tracking-tight">
            Verify Booking
        </h2>

        <!-- Subtitle -->
        <p class="text-cyan-800/80 text-sm leading-relaxed mb-7">

            We've sent a secure 4-digit OTP to your email address.

            <br><br>

            Confirm your booking for

            <span class="font-semibold text-cyan-950"
                  th:text="${foodItem}">
            </span>

        </p>

        <!-- Info Box -->
        <div class="bg-white/40 border border-white/50 rounded-2xl p-4 mb-6 shadow-sm">

            <div class="flex items-center justify-between text-sm">

                <div class="text-left">
                    <p class="text-cyan-700/70 font-medium">
                        Booking Item
                    </p>

                    <p class="text-cyan-950 font-semibold"
                       th:text="${foodItem}">
                    </p>
                </div>

                <div class="w-px h-10 bg-cyan-200"></div>

                <div class="text-right">
                    <p class="text-cyan-700/70 font-medium">
                        OTP Status
                    </p>

                    <p class="text-teal-600 font-semibold">
                        Sent
                    </p>
                </div>

            </div>

        </div>

        <!-- Form -->
        <form action="/verifyOtp" method="post" class="space-y-6">

            <input type="hidden"
                   name="foodItem"
                   th:value="${foodItem}">

            <!-- OTP Input -->
            <div>

                <label class="block text-sm font-semibold text-cyan-900 mb-3">
                    Enter OTP
                </label>

                <input type="text"
                       name="otp"
                       required
                       maxlength="4"
                       pattern="\d{4}"
                       placeholder="••••"
                       class="w-full text-center tracking-[0.7em] text-3xl font-bold px-4 py-4 bg-white/60 border border-white/60 rounded-2xl focus:ring-4 focus:ring-cyan-300 focus:border-cyan-400 outline-none transition duration-300 shadow-md text-cyan-950 placeholder-cyan-400">

                <p class="text-xs text-cyan-700/70 mt-3">
                    Please enter the 4-digit code sent to your email.
                </p>

            </div>

            <!-- Verify Button -->
            <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 via-teal-500 to-cyan-600 hover:from-cyan-400 hover:via-teal-400 hover:to-cyan-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition-all duration-300 hover:-translate-y-1 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-300/40">

                Verify & Book

            </button>

        </form>

        <!-- Bottom Actions -->
        <div class="mt-7 space-y-3">

            <button onclick="window.history.back();"
                    class="text-sm text-cyan-700 hover:text-cyan-950 font-semibold transition duration-200 hover:underline underline-offset-4">

                Cancel Booking

            </button>

            <p class="text-xs text-cyan-700/60">
                Secure OTP verification powered for safe booking 🔒
            </p>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 via-teal-50 to-blue-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-20 left-20 w-72 h-72 bg-cyan-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30"></div>
    <div class="absolute bottom-20 right-20 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30"></div>

    <div class="relative bg-white/40 backdrop-blur-xl border border-white/60 p-8 rounded-[2rem] shadow-xl w-full max-w-sm text-center z-10">
        
        <div class="w-16 h-16 bg-gradient-to-r from-cyan-500 to-teal-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
            <span class="text-2xl">🔒</span>
        </div>
        
        <h2 class="text-2xl font-bold text-cyan-950 mb-2">Verify Booking</h2>
        <p class="text-cyan-800/80 text-sm mb-6">
            We've sent a 4-digit OTP to your email. Enter it below to confirm your token for 
            <strong class="text-cyan-900" th:text="${foodItem}"></strong>.
        </p>

        <form action="/verifyOtp" method="post" class="space-y-5">
            <input type="hidden" name="foodItem" th:value="${foodItem}">

            <div>
                <input type="text" name="otp" required maxlength="4" pattern="\d{4}"
                       class="w-full text-center tracking-[0.5em] text-2xl px-4 py-3 bg-white/50 border border-white/50 rounded-xl focus:ring-2 focus:ring-cyan-400 focus:outline-none transition"
                       placeholder="••••">
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-white font-semibold py-3 px-4 rounded-xl shadow-md transform transition duration-200 active:scale-95 focus:outline-none">
                Verify & Book
            </button>
        </form>

        <div class="mt-6">
            <button onclick="window.history.back();" class="text-sm text-cyan-700 hover:text-cyan-900 font-medium underline-offset-4 hover:underline">
                Cancel Booking
            </button>
        </div>
    </div>

</body>
</html>

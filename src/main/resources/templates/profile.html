<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-cyan-50 to-teal-100 min-h-screen text-teal-900 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="flex justify-between items-center backdrop-blur-md bg-white/40 border border-white/50 p-4 rounded-2xl shadow-sm">
            <h1 class="text-xl font-bold text-teal-800">My Profile</h1>
            <a href="/book" class="px-5 py-2 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-white rounded-xl shadow-md transition-all text-sm font-semibold">
                Back to Dashboard
            </a>
        </div>

        <div class="backdrop-blur-xl bg-white/50 border border-white/60 p-8 rounded-[2rem] shadow-lg">
            <div class="flex items-center space-x-6">
                <div class="h-20 w-20 rounded-full bg-gradient-to-tr from-cyan-400 to-teal-500 flex items-center justify-center text-white text-3xl font-bold shadow-inner">
                    <span th:text="${#strings.substring(student.name, 0, 1)}">S</span>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-cyan-950" th:text="${student.name}">Student Name</h2>
                    <p class="text-teal-700 font-medium mt-1" th:text="${student.email}">student@college.edu</p>
                </div>
            </div>
        </div>

        <div class="backdrop-blur-xl bg-white/50 border border-white/60 p-8 rounded-[2rem] shadow-lg">
            <h3 class="text-xl font-bold mb-6 border-b border-teal-200/50 pb-3 text-cyan-950">Meal Token History</h3>
            
            <div class="overflow-x-auto rounded-2xl border border-white/60 shadow-sm">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-white/60 text-teal-800 uppercase text-xs tracking-wider">
                            <th class="px-6 py-4 font-bold">Booking Date & Time</th>
                            <th class="px-6 py-4 font-bold">Food Item</th>
                            <th class="px-6 py-4 font-bold">Amount Paid</th>
                            <th class="px-6 py-4 font-bold">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-teal-100/50 bg-white/30">
                        <tr th:each="bill : ${bookings}" class="hover:bg-white/50 transition-colors">
                            <td class="px-6 py-4 text-sm font-medium text-teal-800" th:text="${#dates.format(bill.bookingTime, 'dd MMM yyyy, hh:mm a')}">12 Apr 2026</td>
                            <td class="px-6 py-4 text-sm font-semibold text-cyan-900" th:text="${bill.foodItem}">Chicken Biryani</td>
                            <td class="px-6 py-4 text-sm font-bold text-teal-600" th:text="'₹' + ${bill.cost}">₹120</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full bg-cyan-100 text-cyan-700 text-xs font-bold shadow-sm border border-cyan-200">
                                    Confirmed
                                </span>
                            </td>
                        </tr>
                        
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="4" class="px-6 py-12 text-center text-teal-700 font-medium bg-white/20">
                                No meal tokens booked yet. Ready to grab a meal?
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>

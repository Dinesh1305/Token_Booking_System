<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Token</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Animated Background */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(35px, -55px) scale(1.12);
            }
            66% {
                transform: translate(-25px, 25px) scale(0.92);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Floating card animation */
        @keyframes floatCard {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .floating-card {
            animation: floatCard 5s ease-in-out infinite;
        }

        /* Shine effect */
        .shine::before {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                120deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.5) 50%,
                rgba(255,255,255,0) 100%
            );
            transform: skewX(-25deg);
            transition: 0.8s;
        }

        .shine:hover::before {
            left: 130%;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-cyan-50 via-teal-50 to-blue-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

    <div class="absolute top-10 md:top-20 left-10 md:left-1/3 w-72 h-72 bg-cyan-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>

    <div class="absolute top-20 md:top-40 right-10 md:right-1/3 w-72 h-72 bg-teal-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>

    <div class="absolute -bottom-10 left-20 md:left-1/2 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>

    <div class="relative floating-card bg-white/45 backdrop-blur-2xl border border-white/60 p-7 sm:p-9 rounded-[2.2rem] shadow-[0_12px_40px_rgba(31,38,135,0.10)] text-center w-full max-w-sm z-10 transition-all duration-300 hover:shadow-[0_14px_50px_rgba(31,38,135,0.18)]">

        <div class="inline-flex items-center gap-2 bg-cyan-100/70 text-cyan-900 text-xs font-semibold px-4 py-1.5 rounded-full mb-5 border border-cyan-200/50 shadow-sm">
            🍽️ Fresh Meal Available
        </div>

        <h1 class="text-3xl font-bold text-cyan-950 mb-3 tracking-tight leading-tight"
            th:text="${foodItem}">
            Delicious Meal
        </h1>

        <p class="text-cyan-800/70 text-sm mb-6 leading-relaxed">
            Reserve your meal token quickly and enjoy a seamless dining experience today.
        </p>

        <div class="relative shine group rounded-3xl overflow-hidden mb-6 shadow-lg border border-white/60">

            <img th:src="@{${foodImage}}"
                 th:alt="${foodItem}"
                 class="w-full h-56 object-cover transform transition duration-700 group-hover:scale-110">

            <div class="absolute inset-0 bg-gradient-to-t from-cyan-950/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-500"></div>

            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-white/70 backdrop-blur-md px-4 py-1.5 rounded-full text-sm font-medium text-cyan-950 shadow-md border border-white/50">
                Today's Special
            </div>
        </div>

        <div class="bg-white/40 border border-white/50 rounded-2xl p-4 mb-6 shadow-sm">
            <div class="flex items-center justify-between text-sm">

                <div class="text-left">
                    <p class="text-cyan-700/70 font-medium">Meal</p>
                    <p class="text-cyan-950 font-semibold" th:text="${foodItem}">
                        Delicious Meal
                    </p>
                </div>

                <div class="w-px h-10 bg-cyan-200"></div>

                <div class="text-right">
                    <p class="text-cyan-700/70 font-medium">Status</p>
                    <p class="text-teal-600 font-semibold">Available</p>
                </div>

            </div>
        </div>

        <form action="/bookToken" method="get" class="flex flex-col gap-4">

            <input type="hidden" name="foodItem" th:value="${foodItem}">

            <button type="submit"
                    class="relative overflow-hidden w-full bg-gradient-to-r from-cyan-500 via-teal-500 to-cyan-600 hover:from-cyan-400 hover:via-teal-400 hover:to-cyan-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition-all duration-300 active:scale-95 hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-cyan-300/40">
                <span class="relative z-10">Confirm Booking</span>
            </button>

            <button type="button"
                    onclick="window.history.back();"
                    class="w-full bg-white/55 hover:bg-white/80 text-cyan-950 font-semibold py-3.5 px-4 rounded-2xl shadow-sm border border-white/60 transition-all duration-300 active:scale-95 hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-cyan-200/40">
                Go Back
            </button>

            <a href="/profile"
               class="w-full bg-transparent hover:bg-white/40 text-teal-800 font-semibold py-3.5 px-4 rounded-2xl border-2 border-teal-200/50 shadow-sm transition-all duration-300 active:scale-95 hover:-translate-y-1 flex items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-teal-200/40">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
                View Profile History
            </a>

        </form>

        <div class="mt-6 text-sm font-medium">

            <span th:if="${bookingMessage != null && !bookingMessage.trim().isEmpty()}"
                  th:text="${bookingMessage}"
                  class="inline-block text-teal-700 bg-teal-50/80 px-4 py-2 rounded-full border border-teal-100 shadow-sm animate-pulse">
            </span>

            <span th:unless="${bookingMessage != null && !bookingMessage.trim().isEmpty()}"
                  class="text-cyan-700/70">
                🍴 Today's meal is:
                <span th:text="${foodItem}" class="text-cyan-900 font-semibold"></span>
            </span>

        </div>

    </div>

</body>
</html>

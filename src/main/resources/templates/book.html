<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Token</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Custom animations for the background blobs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-50 via-teal-50 to-blue-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

    <div class="absolute top-10 md:top-20 left-10 md:left-1/3 w-64 h-64 bg-cyan-300 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob"></div>
    <div class="absolute top-20 md:top-40 right-10 md:right-1/3 w-64 h-64 bg-teal-300 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 md:left-1/2 w-64 h-64 bg-blue-300 rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-blob animation-delay-4000"></div>

    <div class="relative bg-white/40 backdrop-blur-xl border border-white/60 p-6 sm:p-8 rounded-[2rem] shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] text-center w-full max-w-sm z-10 transform transition-all duration-300 hover:shadow-[0_8px_32px_0_rgba(31,38,135,0.12)]">
        
        <h1 class="text-2xl font-semibold text-cyan-950 mb-4 tracking-tight" th:text="${foodItem}">Delicious Meal</h1>
        
        <div class="relative group rounded-2xl overflow-hidden mb-5 shadow-sm border border-white/50">
            <img th:src="@{${foodImage}}" th:alt="${foodItem}" 
                 class="w-full h-48 object-cover transform transition duration-500 group-hover:scale-110">
            <div class="absolute inset-0 bg-gradient-to-t from-cyan-900/20 to-transparent opacity-0 group-hover:opacity-100 transition duration-300"></div>
        </div>
        
        <p class="text-cyan-800/80 text-sm mb-6 font-medium">Ready to book a token for today's meal?</p>
        
        <form action="/bookToken" method="get" class="flex flex-col gap-3">
            <input type="hidden" name="foodItem" th:value="${foodItem}">
            
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-white font-medium py-3 px-4 rounded-xl shadow-md transform transition duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-1 focus:ring-offset-transparent">
                Confirm Booking
            </button>
            
            <button type="button" onclick="window.history.back();"
                    class="w-full bg-white/50 hover:bg-white/70 text-cyan-900 font-medium py-3 px-4 rounded-xl shadow-sm border border-white/50 transform transition duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-cyan-200">
                Go Back
            </button>
        </form>

        <div class="mt-5 text-sm font-medium">
            <span th:if="${bookingMessage != null && !bookingMessage.trim().isEmpty()}" th:text="${bookingMessage}" class="text-teal-600 bg-teal-50/50 px-3 py-1 rounded-full border border-teal-100/50"></span>
            <span th:unless="${bookingMessage != null && !bookingMessage.trim().isEmpty()}" class="text-cyan-700/60">
                Today's meal is: <span th:text="${foodItem}" class="text-cyan-800"></span>
            </span>
        </div>
        
    </div>

</body>
</html>

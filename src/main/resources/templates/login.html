<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Animated blobs */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 8s infinite ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Floating animation */
        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .floating-card {
            animation: floating 5s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-cyan-50 via-blue-100 to-indigo-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <!-- Background Blobs -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-cyan-300 rounded-full mix-blend-multiply blur-3xl opacity-40 animate-blob"></div>

    <div class="absolute top-32 right-10 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply blur-3xl opacity-40 animate-blob animation-delay-2000"></div>

    <div class="absolute bottom-0 left-1/3 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply blur-3xl opacity-40 animate-blob animation-delay-4000"></div>

    <!-- Login Card -->
    <div class="relative z-10 floating-card bg-white/40 backdrop-blur-2xl border border-white/50 p-8 sm:p-10 rounded-[2rem] shadow-[0_10px_40px_rgba(0,0,0,0.10)] max-w-md w-full transition duration-300 hover:shadow-[0_12px_50px_rgba(0,0,0,0.15)]">

        <!-- Logo -->
        <div class="flex justify-center mb-5">
            <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg">
                <span class="text-4xl">🎓</span>
            </div>
        </div>

        <!-- Heading -->
        <h2 class="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-2">
            Welcome Back
        </h2>

        <p class="text-center text-gray-600 mb-8 text-sm leading-relaxed">
            Sign in to continue and book your meal token easily.
        </p>

        <!-- Error Message -->
        <div th:if="${param.error}"
             class="mb-5 p-4 bg-red-100/80 backdrop-blur-sm border border-red-300 text-red-700 rounded-2xl text-sm text-center font-medium shadow-sm animate-pulse">

            Invalid email or password.

        </div>

        <!-- Form -->
        <form action="/login" method="post" class="space-y-6">

            <!-- Email -->
            <div>
                <label for="email"
                       class="block text-sm font-semibold text-gray-700 mb-2">

                    Email Address

                </label>

                <div class="relative">

                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg">
                        📧
                    </span>

                    <input type="email"
                           id="email"
                           name="email"
                           required
                           placeholder="student@example.com"
                           class="w-full pl-12 pr-4 py-3.5 bg-white/70 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-cyan-200 focus:border-cyan-400 outline-none transition duration-300 shadow-sm text-gray-700 placeholder-gray-400">

                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password"
                       class="block text-sm font-semibold text-gray-700 mb-2">

                    Password

                </label>

                <div class="relative">

                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg">
                        🔒
                    </span>

                    <input type="password"
                           id="password"
                           name="password"
                           required
                           placeholder="••••••••"
                           class="w-full pl-12 pr-4 py-3.5 bg-white/70 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-cyan-200 focus:border-cyan-400 outline-none transition duration-300 shadow-sm text-gray-700 placeholder-gray-400">

                </div>
            </div>

            <!-- Remember + Forgot -->
            <div class="flex items-center justify-between text-sm">

                <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                    <input type="checkbox"
                           class="rounded border-gray-300 text-cyan-500 focus:ring-cyan-400">
                    Remember me
                </label>

                <a href="#"
                   class="text-cyan-700 hover:text-cyan-900 font-medium transition">
                    Forgot Password?
                </a>

            </div>

            <!-- Button -->
            <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600 hover:from-cyan-400 hover:via-blue-400 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition-all duration-300 hover:-translate-y-1 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-300/40">

                Sign In

            </button>

        </form>

        <!-- Bottom Text -->
        <div class="mt-8 text-center text-sm text-gray-600">
            Secure access for students only 🔐
        </div>

    </div>

</body>
</html>
